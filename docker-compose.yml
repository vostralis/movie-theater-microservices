services:
  rabbitmq:
    image: rabbitmq:4.3.6-management
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: rabbit
      RABBITMQ_DEFAULT_PASS: rabbit42
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 15s
      timeout: 10s
      retries: 5

  gateway:
    build: ./gateway
    container_name: movie-theater-gateway
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_DEFAULT_USER: rabbit
      RABBITMQ_DEFAULT_PASS: rabbit42
    ports:
      - "8000:8000"
    depends_on:
      rabbitmq:
        condition: service_healthy

  catalog:
    build: ./catalog
    container_name: movie-theater-catalog
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_DEFAULT_USER: rabbit
      RABBITMQ_DEFAULT_PASS: rabbit42
    depends_on:
      rabbitmq:
        condition: service_healthy

  media_processor:
    build: ./media-processor
    container_name: movie-theater-media-processor
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_DEFAULT_USER: rabbit
      RABBITMQ_DEFAULT_PASS: rabbit42
    depends_on:
      rabbitmq:
        condition: service_healthy
   

